name: Agent PHP Format

on:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: write

concurrency:
  group: agent-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Apply WordPress coding standards fixes
        run: vendor/bin/phpcbf || true
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "tazkar-agent"
          git config user.email "tazkar-agent@users.noreply.github.com"
          git add -- '*.php'
          git commit -m "Apply WordPress coding standards formatting"
          git push origin HEAD:${{ github.ref_name }}
