name: Apply Sprint 5 review fix

on:
  push:
    branches:
      - agent/17-sprint-5-chunk-resume-rollback
    paths:
      - .github/workflows/apply-sprint5-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/17-sprint-5-chunk-resume-rollback
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Reproduce reviewed code and tests
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/repair-sprint5-review.yml")
            step = workflow.fetch("jobs").fetch("repair").fetch("steps").find { |item| item["name"] == "Address active-batch, rollback-preview, and lock-state findings" }
            abort "repair step not found" unless step
            File.write("/tmp/tazkar-repair.sh", step.fetch("run"))
          '
          bash /tmp/tazkar-repair.sh
      - name: Apply WordPress coding-standard fixes
        run: |
          set +e
          vendor/bin/phpcbf src/Admin/CsvPreviewPage.php src/Import/ChunkedImportService.php src/Import/WordPressContentWriter.php
          status=$?
          set -e
          test "$status" -le 1
      - name: Enforce focused quality gates
        run: |
          composer lint
          vendor/bin/phpunit
          vendor/bin/phpstan analyse --no-progress
          vendor/bin/phpcs
      - name: Commit reviewed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 1
          git commit -m "fix: close Sprint 5 review blockers"
          git push origin HEAD:agent/17-sprint-5-chunk-resume-rollback
