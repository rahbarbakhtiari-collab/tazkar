name: Sprint 2 Agent Format

on:
  push:
    branches:
      - 'agent/9-sprint-2-data-validator'

permissions:
  contents: write

concurrency:
  group: sprint2-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Rename methods to WordPress snake case
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'isValid(': 'is_valid(',
              'rowNumber(': 'row_number(',
              'toArray(': 'to_array(',
              'requiredHeaders(': 'required_headers(',
              'requiredValues(': 'required_values(',
              'maximumLengths(': 'maximum_lengths(',
              'integerFields(': 'integer_fields(',
              'validateRequiredValues(': 'validate_required_values(',
              'validateTypes(': 'validate_types(',
              'validateMaximumLengths(': 'validate_maximum_lengths(',
              'validateEnums(': 'validate_enums(',
              'validateVersionAndLanguage(': 'validate_version_and_language(',
              'validateContentTypeRules(': 'validate_content_type_rules(',
              'validateQuranRules(': 'validate_quran_rules(',
              'validateHadithRules(': 'validate_hadith_rules(',
              'validateTitle(': 'validate_title(',
              'validateReflection(': 'validate_reflection(',
              'validateLists(': 'validate_lists(',
              'validateSlug(': 'validate_slug(',
              'validateSourceSelection(': 'validate_source_selection(',
              'validateSystemFields(': 'validate_system_fields(',
              'addWarnings(': 'add_warnings(',
              'isBlank(': 'is_blank(',
              'integerValue(': 'integer_value(',
              'listValues(': 'list_values(',
              'containsHtml(': 'contains_html(',
              'containsNewline(': 'contains_newline(',
              'containsEmojiOrHashtag(': 'contains_emoji_or_hashtag(',
              'sentenceCount(': 'sentence_count(',
          }

          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*.php'):
                  text = path.read_text(encoding='utf-8')
                  changed = text
                  for old, new in replacements.items():
                      changed = changed.replace(old, new)
                  if changed != text:
                      path.write_text(changed, encoding='utf-8')
          PY
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Apply WordPress coding standards fixes
        run: vendor/bin/phpcbf || true
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "tazkar-agent"
          git config user.email "tazkar-agent@users.noreply.github.com"
          git add -- '*.php'
          git commit -m "Apply Sprint 2 WordPress coding standards"
          git push origin HEAD:${{ github.ref_name }}
