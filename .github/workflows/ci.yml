name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository documents and fixtures
        run: python3 scripts/validate_repository.py
      - name: Validate GitHub YAML
        run: ruby -e 'require "yaml"; Dir[".github/**/*.yml"].sort.each { |file| YAML.load_file(file); puts file }'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Run PHPCS and retain diagnostics
        id: phpcs
        continue-on-error: true
        run: vendor/bin/phpcs --report=json --report-file=phpcs-report.json
      - name: Upload PHPCS diagnostics
        if: steps.phpcs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report-${{ matrix.php }}
          path: phpcs-report.json
          retention-days: 7
      - name: Enforce PHPCS
        if: steps.phpcs.outcome == 'failure'
        run: |
          php -r '$report = json_decode(file_get_contents("phpcs-report.json"), true); foreach ($report["files"] as $file => $details) { foreach ($details["messages"] as $message) { printf("%s:%d:%d %s [%s]\n", $file, $message["line"], $message["column"], $message["message"], $message["source"]); } }'
          exit 1
      - run: composer audit --no-interaction --format=plain
      - run: python3 scripts/scan_secrets.py
      - run: composer lint
      - run: composer test
      - run: php tests/activation-smoke.php
      - name: Run PHPStan and retain diagnostics
        id: phpstan
        continue-on-error: true
        run: vendor/bin/phpstan analyse --error-format=json > phpstan-report.json
      - name: Upload PHPStan diagnostics
        if: steps.phpstan.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-report-${{ matrix.php }}
          path: phpstan-report.json
          retention-days: 7
      - name: Enforce PHPStan
        if: steps.phpstan.outcome == 'failure'
        run: |
          php -r '$report = json_decode(file_get_contents("phpstan-report.json"), true); foreach ($report["files"] as $file => $details) { foreach ($details["messages"] as $message) { printf("%s:%d %s [%s]\n", $file, $message["line"], $message["message"], $message["identifier"] ?? "phpstan"); } } foreach ($report["errors"] as $error) { echo $error, "\n"; }'
          exit 1
      - name: Run PHPUnit and retain diagnostics
        id: phpunit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpunit --colors=never 2>&1 | tee phpunit-report.txt
      - name: Upload PHPUnit diagnostics
        if: steps.phpunit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-report-${{ matrix.php }}
          path: phpunit-report.txt
          retention-days: 7
      - name: Enforce PHPUnit
        if: steps.phpunit.outcome == 'failure'
        run: |
          cat phpunit-report.txt
          exit 1
      - run: composer build
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: tazkar-plugin-zip
          path: dist/tazkar-*.zip*

  wordpress-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, wp-cli
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - run: composer build
      - name: Run WordPress 7.0.2 smoke suite
        id: wordpress_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            mkdir -p /tmp/wordpress
            wp core download --path=/tmp/wordpress --version=7.0.2
            wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306
            wp core install --path=/tmp/wordpress --url=http://localhost --title=Tazkar --admin_user=admin --admin_password=password --admin_email=admin@example.com
            zip=$(find "$GITHUB_WORKSPACE/dist" -name 'tazkar-*.zip' -type f | head -n 1)
            wp plugin install "$zip" --path=/tmp/wordpress --activate
            test "$(wp option get tazkar_db_version --path=/tmp/wordpress)" = "2"
            wp plugin deactivate tazkar --path=/tmp/wordpress
            test "$(wp option get tazkar_db_version --path=/tmp/wordpress)" = "2"
            wp plugin activate tazkar --path=/tmp/wordpress
            wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-content-model-smoke.php" --path=/tmp/wordpress
            wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-csv-preview-smoke.php" --path=/tmp/wordpress
            wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-schema-v2-migration-smoke.php" --path=/tmp/wordpress
            wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-csv-import-smoke.php" --path=/tmp/wordpress
            wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-chunked-import-smoke.php" --path=/tmp/wordpress
          } 2>&1 | tee wordpress-smoke.log
      - name: Upload WordPress smoke diagnostics
        if: steps.wordpress_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-smoke-report
          path: wordpress-smoke.log
          retention-days: 7
      - name: Enforce WordPress smoke
        if: steps.wordpress_smoke.outcome == 'failure'
        run: |
          cat wordpress-smoke.log
          exit 1
