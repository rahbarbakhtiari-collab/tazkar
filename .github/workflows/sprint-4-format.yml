name: Temporary Sprint 4 Format

on:
  push:
    branches:
      - agent/15-sprint-4-csv-draft-import

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/15-sprint-4-csv-draft-import
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --quiet

      - name: Apply WordPress formatting fixes
        run: vendor/bin/phpcbf || true

      - name: Apply non-fixable Yoda condition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Import/CsvImportService.php')
          text = path.read_text(encoding='utf-8')
          old = "return $errors > 0 || $invalid > 0 ? 'completed_with_errors' : 'completed';"
          new = "return 0 < $errors || 0 < $invalid ? 'completed_with_errors' : 'completed';"
          if old not in text:
              raise SystemExit('Expected non-Yoda condition was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/sprint-4-format.yml

      - name: Commit fixes to agent branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply Sprint 4 coding standards"
          git push origin HEAD:agent/15-sprint-4-csv-draft-import
