name: Diagnose Sprint 5 repair

on:
  push:
    branches:
      - agent/17-sprint-5-chunk-resume-rollback
    paths:
      - .github/workflows/diagnose-sprint5-repair.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/17-sprint-5-chunk-resume-rollback
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Reproduce patch in a disposable worktree
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/repair-sprint5-review.yml")
            step = workflow.fetch("jobs").fetch("repair").fetch("steps").find { |item| item["name"] == "Address active-batch, rollback-preview, and lock-state findings" }
            abort "repair step not found" unless step
            File.write("/tmp/tazkar-repair.sh", step.fetch("run"))
          '
          bash /tmp/tazkar-repair.sh
      - name: Capture individual quality results
        run: |
          set +e
          : > /tmp/sprint5-diagnostics.txt
          run_check() {
            label="$1"
            shift
            {
              echo "===== ${label} ====="
              "$@"
              status=$?
              echo "EXIT_STATUS=${status}"
              echo
            } >> /tmp/sprint5-diagnostics.txt 2>&1
          }
          run_check "composer lint" composer lint
          run_check "phpunit" vendor/bin/phpunit
          run_check "phpstan" vendor/bin/phpstan analyse --no-progress
          run_check "phpcs" vendor/bin/phpcs
          tail -n 350 /tmp/sprint5-diagnostics.txt > /tmp/sprint5-diagnostics-tail.txt
          cat /tmp/sprint5-diagnostics-tail.txt
          exit 0
      - name: Post diagnostics to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Sprint 5 repair quality diagnostics'
            echo
            echo '```text'
            cat /tmp/sprint5-diagnostics-tail.txt
            echo '```'
          } > /tmp/sprint5-comment.md
          gh pr comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/sprint5-comment.md
