name: Temporary Sprint 4 Yoda Fix

on:
  push:
    branches:
      - agent/15-sprint-4-csv-draft-import

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/15-sprint-4-csv-draft-import
          fetch-depth: 0

      - name: Fix remaining Yoda condition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Import/CsvImportService.php')
          text = path.read_text(encoding='utf-8')
          old = 'if ( $errors === count( $results ) && 0 === $success ) {'
          new = 'if ( count( $results ) === $errors && 0 === $success ) {'
          if old not in text:
              raise SystemExit('Expected condition was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/sprint-4-yoda-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy Sprint 4 Yoda condition"
          git push origin HEAD:agent/15-sprint-4-csv-draft-import
