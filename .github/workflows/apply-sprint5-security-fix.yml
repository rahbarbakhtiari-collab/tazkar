name: Apply Sprint 5 security fixes

on:
  push:
    branches:
      - agent/17-sprint-5-chunk-resume-rollback
    paths:
      - .github/workflows/apply-sprint5-security-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/17-sprint-5-chunk-resume-rollback
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Close shared-deduplication and Trash-safety findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Repository contract and WordPress shared advisory lock.
          replace_once(
              'src/Import/ChunkedImportRepository.php',
              "\tpublic function has_active_batch( int $user_id ): bool;\n\n\tpublic function acquire_lock",
              "\tpublic function has_active_batch( int $user_id ): bool;\n\n\tpublic function acquire_deduplication_lock(): bool;\n\n\tpublic function release_deduplication_lock(): void;\n\n\tpublic function acquire_lock",
          )

          dedup_methods = r'''
          	public function acquire_deduplication_lock(): bool {
          		global $wpdb;
          		/** @var \wpdb $wpdb */

          		$value = $wpdb->get_var(
          			$wpdb->prepare( 'SELECT GET_LOCK(%s, 0)', $this->deduplication_lock_name() )
          		);

          		return 1 === (int) $value;
          	}

          	public function release_deduplication_lock(): void {
          		global $wpdb;
          		/** @var \wpdb $wpdb */

          		$wpdb->get_var(
          			$wpdb->prepare( 'SELECT RELEASE_LOCK(%s)', $this->deduplication_lock_name() )
          		);
          	}

          '''
          replace_once(
              'src/Import/WordPressChunkedImportRepository.php',
              "\t/** @return array{id:int,uuid:string,repeated_source:bool} */",
              dedup_methods + "\t/** @return array{id:int,uuid:string,repeated_source:bool} */",
          )
          replace_once(
              'src/Import/WordPressChunkedImportRepository.php',
              "\tprivate function user_import_lock_name( int $user_id ): string {",
              "\tprivate function deduplication_lock_name(): string {\n\t\tglobal $wpdb;\n\t\t/** @var \\wpdb $wpdb */\n\n\t\treturn 'tazkar-dedup-' . substr( hash( 'sha256', $wpdb->prefix ), 0, 40 );\n\t}\n\n\tprivate function user_import_lock_name( int $user_id ): string {",
          )

          # Serialize find_prior_post + post creation/finalization across every active batch.
          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\ttry {\n\t\t\t$batch = $this->require_batch( $batch_uuid, $user_id );",
              "\t\t$deduplication_locked = false;\n\t\ttry {\n\t\t\t$batch = $this->require_batch( $batch_uuid, $user_id );",
          )
          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\t\tif ( ! in_array( (string) $batch['status'], array( 'staged', 'processing' ), true ) ) {\n\t\t\t\treturn $this->progress( $batch_uuid, $user_id );\n\t\t\t}\n\n\t\t\t$this->repository->recover_processing_rows",
              "\t\t\tif ( ! in_array( (string) $batch['status'], array( 'staged', 'processing' ), true ) ) {\n\t\t\t\treturn $this->progress( $batch_uuid, $user_id );\n\t\t\t}\n\t\t\tif ( ! $this->repository->acquire_deduplication_lock() ) {\n\t\t\t\treturn $this->progress( $batch_uuid, $user_id );\n\t\t\t}\n\t\t\t$deduplication_locked = true;\n\n\t\t\t$this->repository->recover_processing_rows",
          )
          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\t} finally {\n\t\t\t$this->repository->release_lock( (int) $batch['id'], $token );\n\t\t}\n\n\t\treturn $this->progress( $batch_uuid, $user_id );\n\t}\n\n\tpublic function resume",
              "\t\t} finally {\n\t\t\tif ( $deduplication_locked ) {\n\t\t\t\t$this->repository->release_deduplication_lock();\n\t\t\t}\n\t\t\t$this->repository->release_lock( (int) $batch['id'], $token );\n\t\t}\n\n\t\treturn $this->progress( $batch_uuid, $user_id );\n\t}\n\n\tpublic function resume",
          )

          # Trash availability is an explicit contract and preview classification.
          replace_once(
              'src/Import/RollbackAwareContentWriter.php',
              "\tpublic const ROLLBACK_MISSING         = 'missing';",
              "\tpublic const ROLLBACK_MISSING         = 'missing';\n\tpublic const ROLLBACK_TRASH_DISABLED  = 'trash_disabled';",
          )
          replace_once(
              'src/Import/RollbackAwareContentWriter.php',
              "\tpublic function mark_import_ownership( int $post_id, string $batch_uuid, int $row_id ): void;",
              "\tpublic function mark_import_ownership( int $post_id, string $batch_uuid, int $row_id ): void;\n\n\tpublic function trash_available(): bool;",
          )
          replace_once(
              'src/Import/WordPressContentWriter.php',
              "\t/** @return array{outcome:string,interactions:int} */\n\tpublic function inspect_rollback",
              "\tpublic function trash_available(): bool {\n\t\treturn ! defined( 'EMPTY_TRASH_DAYS' ) || (int) EMPTY_TRASH_DAYS > 0;\n\t}\n\n\t/** @return array{outcome:string,interactions:int} */\n\tpublic function inspect_rollback",
          )
          replace_once(
              'src/Import/WordPressContentWriter.php',
              "\t\t$stored_snapshot = (string) get_post_meta( $post_id, self::SNAPSHOT_META, true );\n\t\tif ( '' === $stored_snapshot || ! hash_equals( $stored_snapshot, $this->snapshot_hash( $post_id ) ) ) {",
              "\t\t$stored_snapshot = (string) get_post_meta( $post_id, self::SNAPSHOT_META, true );\n\t\tif ( '' === $stored_snapshot || ! hash_equals( $stored_snapshot, $this->snapshot_hash( $post_id ) ) ) {",
          )
          replace_once(
              'src/Import/WordPressContentWriter.php',
              "\t\treturn array(\n\t\t\t'outcome'      => self::ROLLBACK_ELIGIBLE,\n\t\t\t'interactions' => $interactions,\n\t\t);\n\t}\n\n\tpublic function rollback_owned_draft",
              "\t\tif ( ! $this->trash_available() ) {\n\t\t\treturn array(\n\t\t\t\t'outcome'      => self::ROLLBACK_TRASH_DISABLED,\n\t\t\t\t'interactions' => $interactions,\n\t\t\t);\n\t\t}\n\n\t\treturn array(\n\t\t\t'outcome'      => self::ROLLBACK_ELIGIBLE,\n\t\t\t'interactions' => $interactions,\n\t\t);\n\t}\n\n\tpublic function rollback_owned_draft",
          )
          replace_once(
              'src/Import/WordPressContentWriter.php',
              "\t\tif ( self::ROLLBACK_MISSING === $outcome ) {\n\t\t\treturn self::ROLLBACK_MISSING;\n\t\t}\n\t\tif ( self::ROLLBACK_ELIGIBLE !== $outcome ) {",
              "\t\tif ( self::ROLLBACK_MISSING === $outcome ) {\n\t\t\treturn self::ROLLBACK_MISSING;\n\t\t}\n\t\tif ( ! $this->trash_available() ) {\n\t\t\treturn self::ROLLBACK_CONFLICT;\n\t\t}\n\t\tif ( self::ROLLBACK_ELIGIBLE !== $outcome ) {",
          )

          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\t\t'already_trashed'  => 0,\n\t\t\t'interactions'     => 0,",
              "\t\t\t'already_trashed'  => 0,\n\t\t\t'trash_disabled'   => 0,\n\t\t\t'interactions'     => 0,",
          )
          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\t\t\tcase RollbackAwareContentWriter::ROLLBACK_ALREADY_TRASHED:\n\t\t\t\t\t++$counts['already_trashed'];\n\t\t\t\t\tbreak;\n\t\t\t\tdefault:",
              "\t\t\t\tcase RollbackAwareContentWriter::ROLLBACK_ALREADY_TRASHED:\n\t\t\t\t\t++$counts['already_trashed'];\n\t\t\t\t\tbreak;\n\t\t\t\tcase RollbackAwareContentWriter::ROLLBACK_TRASH_DISABLED:\n\t\t\t\t\t++$counts['trash_disabled'];\n\t\t\t\t\tbreak;\n\t\t\t\tdefault:",
          )
          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\tif ( in_array( (string) $batch['status'], array( 'rolled_back', 'rollback_with_conflicts' ), true ) ) {\n\t\t\treturn $this->progress( $batch_uuid, $user_id );\n\t\t}\n\n\t\t$token =",
              "\t\tif ( in_array( (string) $batch['status'], array( 'rolled_back', 'rollback_with_conflicts' ), true ) ) {\n\t\t\treturn $this->progress( $batch_uuid, $user_id );\n\t\t}\n\t\tif ( ! $this->content_writer->trash_available() ) {\n\t\t\tthrow new RuntimeException( 'WordPress Trash is disabled; rollback was rejected to prevent permanent deletion.' );\n\t\t}\n\n\t\t$token =",
          )

          # Preview exposes disabled Trash and does not offer execution.
          replace_once(
              'src/Admin/CsvPreviewPage.php',
              "\t\t\t\t<tr><th><?php echo esc_html__( 'تعامل‌های ثبت‌شده', 'tazkar' ); ?></th><td><?php echo esc_html( (string) ( $preview['interactions'] ?? 0 ) ); ?></td></tr>",
              "\t\t\t\t<tr><th><?php echo esc_html__( 'زباله‌دان غیرفعال — بازگردانی رد می‌شود', 'tazkar' ); ?></th><td><?php echo esc_html( (string) ( $preview['trash_disabled'] ?? 0 ) ); ?></td></tr>\n\t\t\t\t<tr><th><?php echo esc_html__( 'تعامل‌های ثبت‌شده', 'tazkar' ); ?></th><td><?php echo esc_html( (string) ( $preview['interactions'] ?? 0 ) ); ?></td></tr>",
          )
          replace_once(
              'src/Admin/CsvPreviewPage.php',
              "\t\t\t<?php $this->render_batch_action_form( $batch_uuid, 'rollback', __( 'تأیید و اجرای بازگردانی', 'tazkar' ), 'delete', true ); ?>",
              "\t\t\t<?php if ( 0 === (int) ( $preview['trash_disabled'] ?? 0 ) ) : ?>\n\t\t\t\t<?php $this->render_batch_action_form( $batch_uuid, 'rollback', __( 'تأیید و اجرای بازگردانی', 'tazkar' ), 'delete', true ); ?>\n\t\t\t<?php else : ?>\n\t\t\t\t<p><strong><?php echo esc_html__( 'تا زمانی که WordPress Trash غیرفعال است، اجرای بازگردانی برای جلوگیری از حذف دائمی مسدود می‌ماند.', 'tazkar' ); ?></strong></p>\n\t\t\t<?php endif; ?>",
          )

          # Unit-test fake repository shared lock and writer Trash state.
          replace_once(
              'tests/unit/ChunkedImportServiceTest.php',
              "\tprivate bool $user_locked = false;\n\tpublic ?string $status_after_lock = null;",
              "\tprivate bool $user_locked = false;\n\tprivate bool $deduplication_locked = false;\n\tpublic bool $deduplication_lock_available = true;\n\tpublic ?string $status_after_lock = null;",
          )
          replace_once(
              'tests/unit/ChunkedImportServiceTest.php',
              "\tpublic function acquire_lock( int $batch_id, string $token, string $expires_at ): bool {",
              "\tpublic function acquire_deduplication_lock(): bool {\n\t\tif ( ! $this->deduplication_lock_available || $this->deduplication_locked ) {\n\t\t\treturn false;\n\t\t}\n\t\t$this->deduplication_locked = true;\n\n\t\treturn true;\n\t}\n\n\tpublic function release_deduplication_lock(): void {\n\t\t$this->deduplication_locked = false;\n\t}\n\n\tpublic function acquire_lock( int $batch_id, string $token, string $expires_at ): bool {",
          )
          replace_once(
              'tests/unit/ChunkedImportServiceTest.php',
              "\tpublic array $rollback_calls = array();\n\tprivate int $next_post_id = 101;",
              "\tpublic array $rollback_calls = array();\n\tpublic bool $trash_enabled = true;\n\tprivate int $next_post_id = 101;",
          )
          replace_once(
              'tests/unit/ChunkedImportServiceTest.php',
              "\tpublic function inspect_rollback( int $post_id, string $batch_uuid, int $row_id ): array {",
              "\tpublic function trash_available(): bool {\n\t\treturn $this->trash_enabled;\n\t}\n\n\tpublic function inspect_rollback( int $post_id, string $batch_uuid, int $row_id ): array {",
          )
          replace_once(
              'tests/unit/ChunkedImportServiceTest.php',
              "\t\treturn array(\n\t\t\t'outcome'      => $this->inspection_outcomes[ $post_id ] ?? self::ROLLBACK_ELIGIBLE,",
              "\t\treturn array(\n\t\t\t'outcome'      => $this->trash_enabled\n\t\t\t\t? ( $this->inspection_outcomes[ $post_id ] ?? self::ROLLBACK_ELIGIBLE )\n\t\t\t\t: self::ROLLBACK_TRASH_DISABLED,",
          )
          replace_once(
              'tests/unit/ChunkedImportServiceTest.php',
              "\tpublic function rollback_owned_draft( int $post_id, string $batch_uuid, int $row_id ): string {\n\t\tunset( $batch_uuid, $row_id );",
              "\tpublic function rollback_owned_draft( int $post_id, string $batch_uuid, int $row_id ): string {\n\t\tunset( $batch_uuid, $row_id );\n\t\tif ( ! $this->trash_enabled ) {\n\t\t\treturn self::ROLLBACK_CONFLICT;\n\t\t}",
          )

          new_tests = r'''
          	public function test_process_waits_when_shared_deduplication_lock_is_unavailable(): void {
          		$repository = new TazkarTestChunkedRepository();
          		$writer     = new TazkarTestRollbackWriter();
          		$service    = $this->service( $repository, $writer );
          		$progress   = $service->stage( $this->csv_with_rows( 1 ), 'dedup-lock.csv', 9 );
          		$repository->deduplication_lock_available = false;

          		$progress = $service->process( $progress->batch_uuid(), 9 );

          		self::assertSame( 1, $progress->count( 'pending' ) );
          		self::assertSame( 0, $progress->count( 'imported' ) );
          		self::assertCount( 0, $writer->created );
          	}

          	public function test_rollback_is_rejected_when_wordpress_trash_is_disabled(): void {
          		$repository = new TazkarTestChunkedRepository();
          		$writer     = new TazkarTestRollbackWriter();
          		$service    = $this->service( $repository, $writer );
          		$progress   = $service->stage( $this->csv_with_rows( 1 ), 'trash-disabled.csv', 9 );
          		$progress   = $service->process( $progress->batch_uuid(), 9 );
          		$writer->trash_enabled = false;

          		$preview = $service->rollback_preview( $progress->batch_uuid(), 9 );
          		self::assertSame( 1, $preview['trash_disabled'] );

          		try {
          			$service->rollback( $progress->batch_uuid(), 9 );
          			self::fail( 'Rollback should be rejected when Trash is disabled.' );
          		} catch ( RuntimeException $exception ) {
          			self::assertStringContainsString( 'Trash is disabled', $exception->getMessage() );
          		}

          		self::assertSame( 'imported', $repository->rows[1]['status'] );
          		self::assertCount( 0, $writer->rollback_calls );
          	}

          '''
          replace_once(
              'tests/unit/ChunkedImportServiceTest.php',
              "\tpublic function test_rollback_preview_is_non_mutating_and_reports_classifications(): void {",
              new_tests + "\tpublic function test_rollback_preview_is_non_mutating_and_reports_classifications(): void {",
          )

          # Ensure expected safety mechanisms exist before quality checks.
          checks = {
              'src/Import/ChunkedImportService.php': ['acquire_deduplication_lock', 'release_deduplication_lock', 'Trash is disabled'],
              'src/Import/WordPressContentWriter.php': ['trash_available()', 'ROLLBACK_TRASH_DISABLED'],
              'src/Import/WordPressChunkedImportRepository.php': ['tazkar-dedup-', 'deduplication_lock_name'],
              'tests/unit/ChunkedImportServiceTest.php': ['test_process_waits_when_shared_deduplication_lock_is_unavailable', 'test_rollback_is_rejected_when_wordpress_trash_is_disabled'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing {needle!r}')
          PY
      - name: Apply coding standards
        run: |
          set +e
          vendor/bin/phpcbf src tests/unit/ChunkedImportServiceTest.php
          status=$?
          set -e
          test "$status" -le 1
      - name: Enforce repository gates
        run: |
          composer lint
          vendor/bin/phpunit
          vendor/bin/phpstan analyse --no-progress
          vendor/bin/phpcs
      - name: Commit security fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 1
          git commit -m "fix: serialize deduplication and protect disabled Trash"
          git push origin HEAD:agent/17-sprint-5-chunk-resume-rollback
