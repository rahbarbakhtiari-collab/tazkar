name: Repair Sprint 5 SQL quoting

on:
  push:
    branches:
      - agent/17-sprint-5-chunk-resume-rollback
    paths:
      - .github/workflows/repair-sprint5-sql.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/17-sprint-5-chunk-resume-rollback
      - name: Quote reserved row_number identifier
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/Import/WordPressChunkedImportRepository.php'): [
                  ('SELECT id, batch_id, row_number,', 'SELECT id, batch_id, `row_number`,'),
                  ('ORDER BY row_number ASC LIMIT %d', 'ORDER BY `row_number` ASC LIMIT %d'),
                  ("THEN row_number END", "THEN `row_number` END"),
                  ("'SELECT id, row_number,", "'SELECT id, `row_number`,"),
                  ("ORDER BY row_number ASC'", "ORDER BY `row_number` ASC'"),
                  ('"SELECT id, row_number,', '"SELECT id, `row_number`,'),
              ],
              Path('tests/wordpress-chunked-import-smoke.php'): [
                  ('ORDER BY row_number ASC LIMIT 1', 'ORDER BY `row_number` ASC LIMIT 1'),
                  ('ORDER BY row_number ASC"', 'ORDER BY `row_number` ASC"'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          repository = Path('src/Import/WordPressChunkedImportRepository.php').read_text(encoding='utf-8')
          smoke = Path('tests/wordpress-chunked-import-smoke.php').read_text(encoding='utf-8')
          forbidden = (
              'SELECT id, batch_id, row_number,',
              'ORDER BY row_number ASC',
              'THEN row_number END',
              'SELECT id, row_number,',
          )
          combined = repository + '\n' + smoke
          remaining = [value for value in forbidden if value in combined]
          if remaining:
              raise SystemExit(f'Unquoted row_number SQL remains: {remaining}')
          PY
          php -l src/Import/WordPressChunkedImportRepository.php
          php -l tests/wordpress-chunked-import-smoke.php
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Import/WordPressChunkedImportRepository.php tests/wordpress-chunked-import-smoke.php
          git diff --cached --quiet && exit 1
          git commit -m "fix: quote reserved row_number SQL identifier"
          git push origin HEAD:agent/17-sprint-5-chunk-resume-rollback
