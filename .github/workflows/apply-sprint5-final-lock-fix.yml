name: Apply Sprint 5 final lock fix

on:
  push:
    branches:
      - agent/17-sprint-5-chunk-resume-rollback
    paths:
      - .github/workflows/apply-sprint5-final-lock-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/17-sprint-5-chunk-resume-rollback
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Serialize staging, processing and rollback duplicate state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\ttry {\n\t\t\t$this->repository->begin_row();",
              "\t\t$deduplication_locked = false;\n\t\ttry {\n\t\t\tif ( ! $this->repository->acquire_deduplication_lock() ) {\n\t\t\t\tthrow new RuntimeException( 'Another import or rollback is currently finalizing duplicate state.' );\n\t\t\t}\n\t\t\t$deduplication_locked = true;\n\t\t\t$this->repository->begin_row();",
          )
          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\t} finally {\n\t\t\t$this->repository->release_user_import_lock( $user_id );\n\t\t}\n\n\t\treturn $this->progress",
              "\t\t} finally {\n\t\t\tif ( $deduplication_locked ) {\n\t\t\t\t$this->repository->release_deduplication_lock();\n\t\t\t}\n\t\t\t$this->repository->release_user_import_lock( $user_id );\n\t\t}\n\n\t\treturn $this->progress",
          )
          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\ttry {\n\t\t\t$now = $this->now();\n\t\t\t$this->repository->recover_processing_rows( (int) $batch['id'] );",
              "\t\t$deduplication_locked = false;\n\t\ttry {\n\t\t\t$batch = $this->require_batch( $batch_uuid, $user_id );\n\t\t\tif ( in_array( (string) $batch['status'], array( 'rolled_back', 'rollback_with_conflicts' ), true ) ) {\n\t\t\t\treturn $this->progress( $batch_uuid, $user_id );\n\t\t\t}\n\t\t\tif ( ! $this->repository->acquire_deduplication_lock() ) {\n\t\t\t\treturn $this->progress( $batch_uuid, $user_id );\n\t\t\t}\n\t\t\t$deduplication_locked = true;\n\n\t\t\t$now = $this->now();\n\t\t\t$this->repository->recover_processing_rows( (int) $batch['id'] );",
          )
          replace_once(
              'src/Import/ChunkedImportService.php',
              "\t\t} finally {\n\t\t\t$this->repository->release_lock( (int) $batch['id'], $token );\n\t\t}\n\n\t\treturn $this->progress( $batch_uuid, $user_id );\n\t}\n\n\tpublic function progress",
              "\t\t} finally {\n\t\t\tif ( $deduplication_locked ) {\n\t\t\t\t$this->repository->release_deduplication_lock();\n\t\t\t}\n\t\t\t$this->repository->release_lock( (int) $batch['id'], $token );\n\t\t}\n\n\t\treturn $this->progress( $batch_uuid, $user_id );\n\t}\n\n\tpublic function progress",
          )

          tests = r'''
          	public function test_stage_rejects_when_shared_deduplication_lock_is_unavailable(): void {
          		$repository                               = new TazkarTestChunkedRepository();
          		$writer                                   = new TazkarTestRollbackWriter();
          		$service                                  = $this->service( $repository, $writer );
          		$repository->deduplication_lock_available = false;

          		try {
          			$service->stage( $this->csv_with_rows( 1 ), 'stage-dedup-lock.csv', 9 );
          			self::fail( 'Staging should wait while duplicate state is being finalized.' );
          		} catch ( RuntimeException $exception ) {
          			self::assertStringContainsString( 'duplicate state', $exception->getMessage() );
          		}

          		self::assertSame( array(), $repository->rows );
          		self::assertSame( array(), $repository->batch );
          	}

          	public function test_rollback_waits_when_shared_deduplication_lock_is_unavailable(): void {
          		$repository = new TazkarTestChunkedRepository();
          		$writer     = new TazkarTestRollbackWriter();
          		$service    = $this->service( $repository, $writer );
          		$progress   = $service->stage( $this->csv_with_rows( 1 ), 'rollback-dedup-lock.csv', 9 );
          		$progress   = $service->process( $progress->batch_uuid(), 9 );

          		$repository->deduplication_lock_available = false;
          		$progress = $service->rollback( $progress->batch_uuid(), 9 );

          		self::assertSame( 'completed', $progress->status() );
          		self::assertSame( 'imported', $repository->rows[1]['status'] );
          		self::assertCount( 0, $writer->rollback_calls );
          	}

          '''
          replace_once(
              'tests/unit/ChunkedImportServiceTest.php',
              "\tpublic function test_process_waits_when_shared_deduplication_lock_is_unavailable(): void {",
              tests + "\tpublic function test_process_waits_when_shared_deduplication_lock_is_unavailable(): void {",
          )
          PY
      - name: Apply coding standards
        run: |
          set +e
          vendor/bin/phpcbf src/Import/ChunkedImportService.php tests/unit/ChunkedImportServiceTest.php
          status=$?
          set -e
          test "$status" -le 1
      - name: Enforce repository gates
        run: |
          composer lint
          vendor/bin/phpunit
          vendor/bin/phpstan analyse --no-progress
          vendor/bin/phpcs
      - name: Commit final lock repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 1
          git commit -m "fix: serialize staging and rollback duplicate state"
          git push origin HEAD:agent/17-sprint-5-chunk-resume-rollback
